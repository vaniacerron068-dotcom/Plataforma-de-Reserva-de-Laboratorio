name: Despliegue Continuo (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir artefactos
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Construir frontend para GitHub Pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: frontend

      - name: Publicar artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: PlataformaReservas/pom.xml

      - name: Empaquetar backend (JAR)
        run: mvn -B clean package -DskipTests
        working-directory: PlataformaReservas

      - name: Guardar JAR del backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: PlataformaReservas/target/*.jar

  deploy:
    name: Desplegar frontend en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
